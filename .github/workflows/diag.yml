name: Diag (temporary)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diag.yml"

permissions:
  contents: read

jobs:
  diag:
    name: Diagnose T09 publish dry-run on ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v4.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Run publish.mjs --dry-run and surface stderr as annotations
        run: |
          set +e
          node packages/evolve-dist/scripts/publish.mjs --dry-run > /tmp/pub.out 2> /tmp/pub.err
          CODE=$?
          echo "exit=$CODE"
          echo "--- stdout tail ---"
          tail -20 /tmp/pub.out
          echo "--- stderr tail ---"
          tail -40 /tmp/pub.err
          # 逐行作为 annotation 上浮（每行一条，便于在无法下载日志时读取）
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::PUBERR $line"
          done < <(tail -25 /tmp/pub.err)
          exit 0
