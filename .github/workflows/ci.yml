name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 注: GitHub runner 默认即非 root (uid 1001 runner 用户), sentinel ubuntu job
  # 已以非 root 覆盖全部 L0S 沙箱测试 → 原 L0S non-root job 冗余, 已移除 (L0S-R1 由 sentinel 满足)
  # ── 测试锁 sha256 门: 锁定测试文件不得被篡改 (TEST-LOCK.md §1.2) ────────
  # 这是 self-evolving harness 的核心安全属性: implementer 不得触碰 tests/ 下
  # 已锁定文件。本门重算每个锁定测试文件的 sha256 并与 TEST-LOCK.md §2 表
  # 比对——hash 不变 = 锁定完好。任何篡改/删除/新增未锁定测试 → 立即 fail,
  # 不受 reviewer 社会过程约束, 不受 green 数上升误导。
  # 先于 sentinel / full-suite 运行, 使后续门在锁定完好的前提下才计数。
  test-lock:
    name: Test-lock sha256 gate (TEST-LOCK §1.2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6.5.0
        with:
          node-version: 22
      - name: Verify locked test sha256 against TEST-LOCK.md §2
        run: node scripts/lib/test-lock-check.mjs

  # ── 哨兵门: 已实现任务的测试必须全绿, 不许回归 ─────────────────────
  # 这是权威验收: 本地跑的不算数, 这里 exit 0 才算过
  sentinel:
    name: Sentinel (implemented tasks, no regression)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v4.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      # Linux: 安装 bubblewrap 供 L0S 沙箱真实强制路径测试
      # (runner 以非 root 'runner' 用户跑测试, 满足 ERRATA L0S-R1 要求)
      - name: Install bubblewrap (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Relax AppArmor userns restriction (bwrap needs it on Ubuntu 24.04)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build (all packages, strict)
        run: pnpm -r run build
      - name: Sentinel tests (must be green)
        run: |
          pnpm vitest run \
            tests/L0C/T01-scaffold.spec.ts \
            tests/L0C/T02-turn.spec.ts \
            tests/L0C/T03-stop.spec.ts \
            tests/L0C/T04-retry-overflow.spec.ts \
            tests/L0C/T05-cache-cut.spec.ts \
            tests/L0C/T06-memory-schema.spec.ts \
            tests/L0C/T07a-runstate.spec.ts \
            tests/L0C/T07b-session-log.spec.ts \
            tests/L0C/T08-precommit.spec.ts \
            tests/L0C/T11-readonly.spec.ts \
            tests/L0C/invariants-A.spec.ts \
            tests/L0S/T01.brain-no-credential.spec.ts \
            tests/L0S/T01.session-log-append-only.spec.ts \
            tests/L0S/T01.session-wake-idempotent.spec.ts \
            tests/L0S/T02.sandbox-deny-ssh.spec.ts \
            tests/L0S/T02.sandbox-deny-egress.spec.ts \
            tests/L0S/T02.sandbox-platform-skip.spec.ts \
            tests/L0S/T03.deny-read-ssh.spec.ts \
            tests/L0S/T03.narrower-allow-reopens.spec.ts \
            tests/L0S/T03.symlink-bypass-blocked.spec.ts \
            tests/L0S/T03.worktree-write-scoped.spec.ts \
            tests/L0S/T06.timeout-kills.spec.ts \
            tests/L0S/T06.teardown-on-throw.spec.ts \
            tests/L0S/T06.concurrency-limit.spec.ts \
            tests/L0S/T06.orphan-list.spec.ts \
            tests/TL/T01-transcript.spec.ts \
            tests/TL/T02-usage.spec.ts \
            tests/TL/T05-schema-policy.spec.ts \
            tests/TL/T06-budget-policy.spec.ts \
            tests/gates/g1-smoke.spec.ts 2>&1 | tee /tmp/sentinel.log
          EXIT=${PIPESTATUS[0]}
          grep -E '^\s*×|FAIL ' /tmp/sentinel.log | head -15 | while IFS= read -r l; do echo "::error::$l"; done
          exit $EXIT

  # ── 全量套件: 逐用例 ID 集合回归门 (ISS-24) ──────────────────────
  # 用 tests/.baseline/passed.json 的用例 ID 集合比对(删除计数容差弱点)。
  full-suite:
    name: Full suite (baseline regression gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v4.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Relax AppArmor userns restriction (bwrap needs it on Ubuntu 24.04)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Test-lock sha256 gate (defense in depth)
        run: node scripts/lib/test-lock-check.mjs
      - name: Full suite + per-test ID-set baseline gate (ISS-24)
        run: node scripts/lib/test-baseline.mjs
