name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 哨兵门: 已实现任务的测试必须全绿, 不许回归 ─────────────────────
  # 这是权威验收: 本地跑的不算数, 这里 exit 0 才算过
  sentinel:
    name: Sentinel (implemented tasks, no regression)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: pnpm/action-setup@fe02b34f77f8bc86e60342e0192b3f2d305eee70  # v4.0.0
        with:
          version: 10
      - uses: actions/setup-node@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      # Linux: 安装 bubblewrap 供 L0S 沙箱真实强制路径测试
      # (runner 以非 root 'runner' 用户跑测试, 满足 ERRATA L0S-R1 要求)
      - name: Install bubblewrap (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build (all packages, strict)
        run: pnpm -r run build
      - name: Sentinel tests (must be green)
        run: |
          pnpm vitest run \
            tests/L0C/T01-scaffold.spec.ts \
            tests/L0C/T02-turn.spec.ts \
            tests/L0C/T03-stop.spec.ts \
            tests/L0C/T04-retry-overflow.spec.ts \
            tests/L0C/T05-cache-cut.spec.ts \
            tests/L0C/T06-memory-schema.spec.ts \
            tests/L0C/T07a-runstate.spec.ts \
            tests/L0C/T07b-session-log.spec.ts \
            tests/L0C/T08-precommit.spec.ts \
            tests/L0C/T11-readonly.spec.ts \
            tests/L0C/invariants-A.spec.ts \
            tests/L0S/T01.brain-no-credential.spec.ts \
            tests/L0S/T01.session-log-append-only.spec.ts \
            tests/L0S/T01.session-wake-idempotent.spec.ts \
            tests/L0S/T02.sandbox-deny-ssh.spec.ts \
            tests/L0S/T02.sandbox-deny-egress.spec.ts \
            tests/L0S/T02.sandbox-platform-skip.spec.ts \
            tests/L0S/T03.deny-read-ssh.spec.ts \
            tests/L0S/T03.narrower-allow-reopens.spec.ts \
            tests/L0S/T03.symlink-bypass-blocked.spec.ts \
            tests/L0S/T03.worktree-write-scoped.spec.ts \
            tests/L0S/T06.timeout-kills.spec.ts \
            tests/L0S/T06.teardown-on-throw.spec.ts \
            tests/L0S/T06.concurrency-limit.spec.ts \
            tests/L0S/T06.orphan-list.spec.ts \
            tests/TL/T01-transcript.spec.ts \
            tests/TL/T02-usage.spec.ts \
            tests/TL/T05-schema-policy.spec.ts \
            tests/TL/T06-budget-policy.spec.ts \
            tests/gates/g1-smoke.spec.ts

  # ── 全量套件: 当前 MVP 未完成, 未实现任务的红项是合法 RED ──────────
  # 报告 green/red 并与 GREENS.baseline 对比: 绿数不许低于基线(回归即fail)
  # MVP 完成后: 基线 = 全量, 此 job 即成为完整验收门
  full-suite:
    name: Full suite (baseline regression gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: pnpm/action-setup@fe02b34f77f8bc86e60342e0192b3f2d305eee70  # v4.0.0
        with:
          version: 10
      - uses: actions/setup-node@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Run full suite, count greens
        id: suite
        run: |
          set +e
          pnpm vitest run --reporter=basic > suite.log 2>&1
          GREENS=$(grep -oE '[0-9]+ passed' suite.log | tail -1 | grep -oE '[0-9]+')
          echo "greens=$GREENS" >> "$GITHUB_OUTPUT"
          echo "Actual greens: $GREENS"
          tail -5 suite.log
      - name: Compare against baseline (no regression)
        run: |
          BASELINE=$(cat GREENS.baseline 2>/dev/null || echo 0)
          ACTUAL=${{ steps.suite.outputs.greens }}
          echo "baseline=$BASELINE actual=$ACTUAL"
          if [ "$ACTUAL" -lt "$BASELINE" ]; then
            echo "::error::Regression! greens $ACTUAL < baseline $BASELINE — 实现过的测试变红了"
            exit 1
          fi
          if [ "$ACTUAL" -gt "$BASELINE" ]; then
            echo "::warning::greens $ACTUAL > baseline $BASELINE — 有新实现, 记得更新 GREENS.baseline"
          fi
      - name: Upload suite log (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: suite-log-${{ github.sha }}
          path: suite.log
