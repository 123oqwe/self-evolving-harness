name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 注: GitHub runner 默认即非 root (uid 1001 runner 用户), full-suite matrix job
  # 已以非 root 在 ubuntu + macOS 覆盖全部 L0S 沙箱测试 → 原 L0S non-root job 冗余, 已移除
  # ── 测试锁 sha256 门: 锁定测试文件不得被篡改 (TEST-LOCK.md §1.2) ────────
  # 这是 self-evolving harness 的核心安全属性: implementer 不得触碰 tests/ 下
  # 已锁定文件。本门重算每个锁定测试文件的 sha256 并与 TEST-LOCK.md §2 表
  # 比对——hash 不变 = 锁定完好。任何篡改/删除/新增未锁定测试 → 立即 fail,
  # 不受 reviewer 社会过程约束, 不受 green 数上升误导。
  # 先于 full-suite 运行, 使后续门在锁定完好的前提下才计数。
  test-lock:
    name: Test-lock sha256 gate (TEST-LOCK §1.2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.0
        with:
          fetch-depth: 0  # ISS-26 --commits 需要完整历史(log base..HEAD)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6.5.0
        with:
          node-version: 22
      - name: Verify locked test sha256 against TEST-LOCK.md §2
        run: node scripts/lib/test-lock-check.mjs
      - name: ISS-26 commit prefix check (tests/ or TEST-LOCK.md touches need test-lock:)
        if: github.event_name == 'pull_request'
        run: node scripts/lib/test-lock-check.mjs --commits ${{ github.event.pull_request.base.sha }}..HEAD

  # ── 全量套件: 逐用例 ID 集合回归门 (ISS-24) ──────────────────────
  # 用 tests/.baseline/passed.json 的用例 ID 集合比对(删除计数容差弱点)。
  # ID 归一化见 scripts/lib/test-baseline.mjs normalizeTestId——平台无关。
  full-suite:
    name: Full suite + ID-set gate (ubuntu + macOS)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v4.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install bubblewrap (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Relax AppArmor userns restriction (bwrap needs it on Ubuntu 24.04)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build (all packages, strict tsc --noEmit)
        run: pnpm -r run build
      - name: Test-lock sha256 gate (defense in depth)
        run: node scripts/lib/test-lock-check.mjs
      - name: Full suite + per-test ID-set baseline gate (ISS-24)
        run: node scripts/lib/test-baseline.mjs

  # ISS-30: 覆盖率报告(只报告不拦截, 独立 job 不影响其他门)
  coverage:
    name: Coverage (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v4.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Run coverage
        run: pnpm vitest run --coverage --reporter=basic || true
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
