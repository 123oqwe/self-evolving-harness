  #     - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6.5.0
  #       with:
  #         node-version: 22
  #         cache: pnpm
  #     - name: Install deps
  #       run: pnpm install --frozen-lockfile
