# OPS-T01: 持续进化调度 (GitHub Actions).
#
# Spec: execution/adapt/TASKS.md §OPS-T01.
#
# 双模式:
#   1. 审计模式 (默认, 无密钥, schedule + workflow_dispatch 默认入参):
#      checkout → pnpm → build → 全套件 → 基线对比 (GREENS.baseline 容差)
#      → test-lock sha256 门 → metrics 报告上传 artifact. 无密钥即全绿, 不红.
#   2. 真实进化模式 (需 LLM secret, 见 docs/runbooks/evolution-real.md):
#      以注释掉的 job 形式文档化——默认关闭, 须手动配置 secret 后取消注释.
#      reject (strict-improvement 拦住退化变体) 是合法结果, exit 0, 非 CI 红.
#
# 安全铁律 (§OPS-T01 执行提示):
#   - 无密钥时 CI 不红: 真实模式 job 用 secret 双条件门, 缺一即 skip.
#   - reject ≠ CI 失败: run-evolution-001.mjs 即使全部变异被拒也 exit 0.
#   - schedule 保守 (周一次): 真实进化烧钱, 别高频; 真实模式只走 workflow_dispatch.
#   - 不破坏 ci.yml: 本 workflow 独立, 与 .github/workflows/ci.yml 解耦.
#   - metrics artifact 命名稳定 (metrics-${{ github.sha }}) 供 OPS-T02 聚合.

name: Evolution

on:
  # 周定时审计 (保守: 每周一次, 仅跑无密钥审计模式, 不烧 LLM 费用).
  schedule:
    - cron: '0 3 * * 1'  # 每周一 03:00 UTC
  # 手动触发 (可选 real_evolution=true 触发真实模式, 需 secret).
  workflow_dispatch:
    inputs:
      real_evolution:
        description: 'Run real evolution loop (needs LLM secret; see runbook)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: evolution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # 进化循环不许中途被新触发取消 (回滚半途风险)

jobs:
  # ── 审计模式: 无密钥, 全套件 + 基线门 + test-lock 门 + metrics ──────────
  # 这是默认/唯一在 schedule 上自动跑的 job. 无 secret 即全绿通过.
  audit:
    name: Audit mode (no secret, full suite + baseline + test-lock + metrics)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v4.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install bubblewrap (Linux sandbox for L0S tests)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Relax AppArmor userns restriction (bwrap on Ubuntu 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build (all packages, strict)
        run: pnpm -r run build

      # ── test-lock sha256 门 (TEST-LOCK §1.2): 锁定测试不得篡改 ──────────
      # 先于全套件跑, 使后续计数建立在锁定完好的前提下.
      - name: Test-lock sha256 gate (TEST-LOCK §1.2)
        run: node scripts/lib/test-lock-check.mjs

      # ── 全套件 + 基线对比 (复用 ci.yml 同款门, 容差与 ci.yml 一致) ──────
      - name: Run full suite, count greens
        id: suite
        run: |
          set +e
          pnpm vitest run --reporter=basic > suite.log 2>&1
          GREENS=$(grep -oE '[0-9]+ passed' suite.log | tail -1 | grep -oE '[0-9]+')
          GREENS=${GREENS:-0}
          echo "greens=$GREENS" >> "$GITHUB_OUTPUT"
          echo "Actual greens: $GREENS"
          tail -5 suite.log
      - name: Compare against GREENS.baseline (no regression)
        run: |
          BASELINE=$(cat GREENS.baseline 2>/dev/null || echo 0)
          ACTUAL=${{ steps.suite.outputs.greens }}
          echo "baseline=$BASELINE actual=$ACTUAL"
          # 容差与 ci.yml 一致 (OPS-T03 收紧至 2). 审计模式下批量回归仍须红.
          if [ "$ACTUAL" -lt $((BASELINE - 2)) ]; then
            echo "::error::Regression! greens $ACTUAL < baseline-2 ($((BASELINE - 2))) — 批量变红, 回归"
            grep -E "^\s*×|FAIL " suite.log | head -15 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          if [ "$ACTUAL" -lt "$BASELINE" ]; then
            echo "::warning::greens $ACTUAL 略低于 baseline $BASELINE (容差内, 疑单测抖动)"
          fi
          if [ "$ACTUAL" -gt "$BASELINE" ]; then
            echo "::warning::greens $ACTUAL > baseline $BASELINE — 有新实现, 记得更新 GREENS.baseline"
          fi

      # ── metrics 聚合 (OPS-T02 scripts/metrics.mjs): 若已落地则跑, 否则跳过 ──
      # continue-on-error: metrics 缺失/解析失败不红审计门 (OPS-T02 独立任务).
      - name: Aggregate metrics (OPS-T02, optional)
        continue-on-error: true
        run: |
          if [ -f scripts/metrics.mjs ]; then
            node scripts/metrics.mjs --reports reports/ --out metrics.json || \
              echo "::warning::metrics.mjs ran but failed; non-fatal in audit mode"
          else
            echo "::notice::scripts/metrics.mjs not yet landed (OPS-T02); skipping metrics aggregation"
          fi

      # ── pi -p 可达性自检 (skipIf: 无 pi 不红) ──────────────────────────
      # 审计模式只检测 pi 是否可达, 不真调 LLM (不烧费用). 真实往返见 real job.
      - name: pi -p reachability (skipIf no pi)
        continue-on-error: true
        run: |
          if command -v pi >/dev/null 2>&1; then
            echo "pi found: $(pi --version 2>&1 || echo 'version unknown')"
          else
            echo "::notice::pi not on PATH (CI runner); real-evolution mode requires pi — audit mode still green"
          fi

      # ── metrics + suite log artifact 上传 (供 OPS-T02 聚合 / 排查) ──────
      # 命名稳定: metrics-${{ github.sha }} (OPS-T02 聚合依赖).
      - name: Upload metrics + suite artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: metrics-${{ github.sha }}
          path: |
            metrics.json
            reports/metrics-trend.md
            suite.log
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # ISS-28: 无密钥也能在 CI 真跑闭环（假 pi fixture）。
  # 证明 mine→mutate→score→select→deploy→verify 真实执行（真实子进程 spawn +
  # canary 命令真实 exit-code + 机械证据落盘），而非仅单元级正确性。
  # ─────────────────────────────────────────────────────────────────────────
  e2e-fake-pi:
    name: E2E loop with fake pi (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v4.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r run build
      - name: ISS-28 e2e loop (fake pi) + baseline blindspot
        run: |
          pnpm vitest run \
            tests/E2E/ISS28-e2e-loop-fake-pi.spec.ts \
            tests/ops/ISS28-baseline-blindspot.spec.ts \
            --reporter=basic
      - name: Upload e2e cycle report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: iss28-e2e-report-${{ github.sha }}
          path: |
            reports/
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # 真实进化模式（条件 job，非注释）：
  #   - 无 secret 时自动 skip 且不红（双条件门: inputs.real_evolution && secret）。
  #   - reject 是合法结果（strict-improvement 拦退化仍 exit 0）。
  # Runbook: docs/runbooks/evolution-real.md
  # ─────────────────────────────────────────────────────────────────────────
  real-evolution:
    name: Real evolution loop (needs LLM secret)
    needs: audit  # 审计门先过, 再烧 LLM 费用
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.real_evolution == true && secrets.PI_API_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PI_API_KEY: ${{ secrets.PI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v4.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r run build
      - name: Run real evolution loop (REAL-T02)
        # reject (strict-improvement 拦退化) 是合法结果 → exit 0.
        # 仅 LLM 超时/崩溃/非法调用才非零 exit.
        run: node scripts/run-evolution-001.mjs
      - name: Upload evolution report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: evolution-run-${{ github.sha }}
          path: reports/evolution-run-*.md
          if-no-files-found: ignore
