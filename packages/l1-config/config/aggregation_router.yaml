# L1-T20 · aggregation router active 基线（config/aggregation_router.yaml）
# 多 agent 投票/辩论/共识协议路由表。进化的对象 = 本文件。
# 投票须独立先解 / 辩论 sparse N-neighbors = static-core（防 groupthink）。
# martingale 消融（NeurIPS 2025）：多数投票单独占大部分增益 → 推理类倾向 vote。

reasoning:
